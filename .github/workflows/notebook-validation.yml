name: Notebook validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook validator
        run: python -m pip install nbformat
      - name: Validate notebook and Python syntax
        run: |
          python - <<'PY'
          import ast
          import nbformat
          from pathlib import Path

          path = Path("notebooks/01_data_visualization_assignment.ipynb")
          notebook = nbformat.read(path, as_version=4)
          nbformat.validate(notebook)
          cells = [c.source for c in notebook.cells if c.cell_type == "code"]
          for index, source in enumerate(cells, 1):
              ast.parse(source, filename=f"code_cell_{index}")
          print(f"Validated {len(notebook.cells)} cells and {len(cells)} code cells.")
          PY
